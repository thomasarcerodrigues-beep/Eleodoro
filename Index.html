<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header {
            background-color: black;
            color: aqua;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        main {
            background-color: aliceblue;
            color: blue;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        img {
            width: 80px;
            height: 80px;
            object-fit: cover;
        }
        .artigo-autor {
            font-weight: bold;
        }

</head>
<body>
    <header>
        <h1>Meu blog tech</h1>

    <main>
        <img src="livro.jpeg" alt="Um ícone de desenho animado colorido e moderno que mostra um livro aberto com uma lâmpada acesa saindo de dentro. A lâmpada tem circuitos eletrônicos internos e está cercada por números binários (0 e 1) flutuantes e formas geométricas simples, simbolizando a união entre conhecimento e tecnologia">
        <div>
            <h2>Meu primeiro post</h2>
            <p class="artigo-autor">por: Thomas D'Arce</p>
            <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
            <button>❤️ <span>0</span></button>
        </div>

    </main>
</body>
<script>
    const botao = document.querySelector("button");
    botao.addEventListener("click", botaoClicado);

        console.log("fui clicado");

    }
</script>
</html>
